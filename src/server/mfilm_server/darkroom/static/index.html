<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromurgy — Digital Darkroom</title>
<link rel="icon" type="image/svg+xml" href="/darkroom/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/darkroom/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/darkroom/static/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/darkroom/static/apple-touch-icon.png">
<link rel="manifest" href="/darkroom/static/site.webmanifest">
<meta name="theme-color" content="#120d0b">
<link rel="stylesheet" href="/darkroom/static/darkroom.css">
</head>
<body>
<header class="top">
  <h1><span class="lamp" aria-hidden="true"></span>Chromurgy <span style="font-size:0.75em;opacity:0.65;font-weight:400;letter-spacing:0.12em">Darkroom</span></h1>
  <nav id="steps" aria-label="Steps"></nav>
  <button id="btn_settings" class="ghost" hidden title="Darkroom and PhotoPrism settings">⚙ Settings</button>
  <button id="logout" class="ghost" hidden>Log out</button>
</header>
<main id="app"></main>
<div id="modal_overlay" class="modal-backdrop" hidden></div>
<div id="loader" hidden role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/darkroom/static/darkroom.js" defer></script>
</body>
</html>
