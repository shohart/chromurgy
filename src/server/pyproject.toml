[project]
name = "mfilm-server"
version = "0.0.1"
description = "M-Film CHDK Edition: Linux receiver, archive and SD importer (server-first developer)"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "numpy>=1.26", "rawpy>=0.21", "pillow>=10", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
tools = ["numpy>=1.26"]

[project.scripts]
mfilmctl = "mfilm_server.cli:main"
mfilm-develop = "mfilm_server.develop:main"
mfilm-receiver = "mfilm_server.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mfilm_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
