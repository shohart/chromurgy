[project]
name = "mfilm-server"
version = "0.0.1"
description = "M-Film CHDK Edition: Linux receiver, archive and SD importer (server-first developer)"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mfilmctl = "mfilm_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mfilm_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
