openapi: 3.1.0
info:
  title: M-Film Creative API Extension (proposed)
  version: 0.6.0
  description: MERGE with existing Linux server. Original six optical effect IDs preserved; seven new standalone effects and Vintage Glass added
    to the SAME creative/optical pipeline and Web Darkroom.
paths:
  /api/v1/creative/camera-looks:
    get:
      summary: Available camera look profiles
      responses:
        '200':
          description: Versioned list (do not expose unsupported assets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - items
  /api/v1/creative/optical-effects:
    get:
      summary: Available optical effects
      responses:
        '200':
          description: Versioned list (do not expose unsupported assets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - items
  /api/v1/creative/presets:
    get:
      summary: Available composite presets
      responses:
        '200':
          description: Versioned list (do not expose unsupported assets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - items
  /api/v1/renders:
    post:
      summary: Create idempotent render job from existing archived original RAW and v2 creative recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source_asset_id:
                  type: string
                recipe:
                  $ref: '#/components/schemas/RenderRecipeV2'
                set_publish_default:
                  type: boolean
                  default: false
              required:
              - source_asset_id
              - recipe
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
        '400':
          description: Bad recipe
        '404':
          description: Unknown original
        '409':
          description: Conflict or incompatible bundle
        '422':
          description: Unsupported profile/effect combination
  /api/v1/renders/{render_id}:
    get:
      summary: Read render job and applied stage provenance
      parameters:
      - name: render_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
        '404':
          description: Unknown render
  /api/v1/renders/{render_id}/publish:
    post:
      summary: Idempotently set preferred publication rendition in PhotoPrism
      parameters:
      - name: render_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Publication requested or already complete
        '404':
          description: Unknown render
        '409':
          description: Render not complete
  /api/v1/creative/optical-effects/{effect_id}:
    get:
      summary: Read a single descriptor from existing unified Optical Effect registry
      parameters:
      - in: path
        name: effect_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Effect metadata: stage, controls, availability and implementation version'
        '404':
          description: Unknown effect
  /api/v1/creative/optical-sources:
    post:
      summary: Optional light source candidate analysis from an existing authorized RAW asset; used by same Web Darkroom optical control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_asset_id
              properties:
                source_asset_id:
                  type: string
                threshold:
                  type: number
                  minimum: 0
                max_sources:
                  type: integer
                  minimum: 1
                  maximum: 32
      responses:
        '200':
          description: Normalized source coordinates and detector version
        '401':
          description: Authentication required
        '422':
          description: Unsupported asset or invalid input
components:
  schemas:
    RenderRecipeV2:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://example.invalid/mfilm/contracts/render-recipe-v2.schema.json
      description: SPECIFICATION CONTRACT ONLY; replace example.invalid in production
      title: M-Film Creative Render Recipe v2
      type: object
      additionalProperties: false
      required:
      - schema_version
      - camera_look
      - film
      - optical
      - render
      - seed
      properties:
        schema_version:
          type: integer
          const: 2
        preset_id:
          type: string
          minLength: 1
        camera_look:
          type: object
          additionalProperties: false
          required:
          - id
          - version
          - strength
          properties:
            id:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
            strength:
              type: number
              minimum: 0
              maximum: 1
            bundle_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
        film:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
            bundle_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
            grain_scale:
              type: number
              minimum: 0
              maximum: 2
            halation_scale:
              type: number
              minimum: 0
              maximum: 2
            softness_scale:
              type: number
              minimum: 0
              maximum: 2
        optical:
          type: object
          additionalProperties: false
          required:
          - preset_id
          - strength
          - stack
          properties:
            preset_id:
              type: string
              minLength: 1
            strength:
              type: number
              minimum: 0
              maximum: 1
            halation_policy:
              enum:
              - film
              - optical
              - stacked
              - disabled
            stack:
              type: array
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - enabled
                - parameters
                properties:
                  id:
                    type: string
                    minLength: 1
                  enabled:
                    type: boolean
                  parameters:
                    type: object
                    additionalProperties:
                      oneOf:
                      - type: number
                      - type: string
                        maxLength: 128
                      - type: boolean
                    description: Validated against typed effect registry; numeric existing parameters remain valid. String enum controls optional
                      for new effects only.
                  source_selection:
                    type: object
                    additionalProperties: false
                    required:
                    - mode
                    properties:
                      mode:
                        enum:
                        - auto
                        - manual
                        - auto_plus_manual
                        - 'off'
                      points:
                        type: array
                        maxItems: 32
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - x
                          - y
                          properties:
                            x:
                              type: number
                              minimum: 0
                              maximum: 1
                            y:
                              type: number
                              minimum: 0
                              maximum: 1
                            weight:
                              type: number
                              minimum: 0
                              maximum: 4
                            radius:
                              type: number
                              minimum: 0
                              maximum: 1
                            label:
                              type: string
                              maxLength: 96
                      excluded_ids:
                        type: array
                        maxItems: 32
                        items:
                          type: string
                          maxLength: 128
                  mask:
                    type: object
                    additionalProperties: false
                    required:
                    - mode
                    properties:
                      mode:
                        enum:
                        - whole_image
                        - radial
                        - linear
                        - mask_asset
                      asset_id:
                        type: string
                        maxLength: 128
                      invert:
                        type: boolean
                      strength:
                        type: number
                        minimum: 0
                        maximum: 1
                      center_x:
                        type: number
                        minimum: 0
                        maximum: 1
                      center_y:
                        type: number
                        minimum: 0
                        maximum: 1
                      radius:
                        type: number
                        minimum: 0
                        maximum: 2
                      feather:
                        type: number
                        minimum: 0
                        maximum: 1
                      angle_degrees:
                        type: number
                        minimum: -180
                        maximum: 180
                  implementation_version:
                    type: string
                    minLength: 1
                    maxLength: 80
                    description: Pinned operator version; optional for legacy recipes, resolved by engine.
                description: Same legacy optical.stack entry, now with optional source selection and masking for new Linux effects.
            vignette_policy:
              enum:
              - film
              - optical
              - stacked
              - disabled
              description: Optional film/optical vignetting ownership; omitted in old recipes.
        render:
          type: object
          additionalProperties: false
          required:
          - output_format
          - output_color_space
          - quality
          properties:
            output_format:
              enum:
              - jpeg
              - tiff
              - png
            output_color_space:
              enum:
              - srgb
              - display_p3
              - rec2020
            quality:
              type: integer
              minimum: 1
              maximum: 100
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        seed:
          type: integer
          minimum: 0
        extensions:
          type: object
          additionalProperties: true
    RenderJob:
      type: object
      properties:
        render_id:
          type: string
        status:
          enum:
          - queued
          - processing
          - complete
          - failed
          - canceled
        progress:
          type: number
          minimum: 0
          maximum: 1
        applied_stages:
          type: array
          items:
            type: string
        omitted_stages:
          type: array
          items:
            type: string
        output_asset_id:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - render_id
      - status
