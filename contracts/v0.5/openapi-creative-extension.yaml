openapi: 3.1.0
info:
  title: M-Film Creative API Extension (proposed)
  version: 0.4.0
  description: To MERGE into existing server-first API without breaking v0.3 ingest/sync
    endpoints. This file is not a standalone server implementation.
paths:
  /api/v1/creative/camera-looks:
    get:
      summary: Available camera look profiles
      responses:
        '200':
          description: Versioned list (do not expose unsupported assets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - items
  /api/v1/creative/optical-effects:
    get:
      summary: Available optical effects
      responses:
        '200':
          description: Versioned list (do not expose unsupported assets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - items
  /api/v1/creative/presets:
    get:
      summary: Available composite presets
      responses:
        '200':
          description: Versioned list (do not expose unsupported assets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - items
  /api/v1/renders:
    post:
      summary: Create idempotent render job from existing archived original RAW and
        v2 creative recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source_asset_id:
                  type: string
                recipe:
                  $ref: '#/components/schemas/RenderRecipeV2'
                set_publish_default:
                  type: boolean
                  default: false
              required:
              - source_asset_id
              - recipe
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
        '400':
          description: Bad recipe
        '404':
          description: Unknown original
        '409':
          description: Conflict or incompatible bundle
        '422':
          description: Unsupported profile/effect combination
  /api/v1/renders/{render_id}:
    get:
      summary: Read render job and applied stage provenance
      parameters:
      - name: render_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
        '404':
          description: Unknown render
  /api/v1/renders/{render_id}/publish:
    post:
      summary: Idempotently set preferred publication rendition in PhotoPrism
      parameters:
      - name: render_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Publication requested or already complete
        '404':
          description: Unknown render
        '409':
          description: Render not complete
components:
  schemas:
    RenderRecipeV2:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://example.invalid/mfilm/contracts/render-recipe-v2.schema.json
      description: SPECIFICATION CONTRACT ONLY; replace example.invalid in production
      title: M-Film Creative Render Recipe v2
      type: object
      additionalProperties: false
      required:
      - schema_version
      - camera_look
      - film
      - optical
      - render
      - seed
      properties:
        schema_version:
          type: integer
          const: 2
        preset_id:
          type: string
          minLength: 1
        camera_look:
          type: object
          additionalProperties: false
          required:
          - id
          - version
          - strength
          properties:
            id:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
            strength:
              type: number
              minimum: 0
              maximum: 1
            bundle_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
        film:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
            bundle_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
            grain_scale:
              type: number
              minimum: 0
              maximum: 2
            halation_scale:
              type: number
              minimum: 0
              maximum: 2
            softness_scale:
              type: number
              minimum: 0
              maximum: 2
        optical:
          type: object
          additionalProperties: false
          required:
          - preset_id
          - strength
          - stack
          properties:
            preset_id:
              type: string
              minLength: 1
            strength:
              type: number
              minimum: 0
              maximum: 1
            halation_policy:
              enum:
              - film
              - optical
              - stacked
              - disabled
            stack:
              type: array
              maxItems: 8
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - enabled
                - parameters
                properties:
                  id:
                    type: string
                    minLength: 1
                  enabled:
                    type: boolean
                  parameters:
                    type: object
                    additionalProperties:
                      type: number
        render:
          type: object
          additionalProperties: false
          required:
          - output_format
          - output_color_space
          - quality
          properties:
            output_format:
              enum:
              - jpeg
              - tiff
              - png
            output_color_space:
              enum:
              - srgb
              - display_p3
              - rec2020
            quality:
              type: integer
              minimum: 1
              maximum: 100
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        seed:
          type: integer
          minimum: 0
        extensions:
          type: object
          additionalProperties: true
    RenderJob:
      type: object
      properties:
        render_id:
          type: string
        status:
          enum:
          - queued
          - processing
          - complete
          - failed
          - canceled
        progress:
          type: number
          minimum: 0
          maximum: 1
        applied_stages:
          type: array
          items:
            type: string
        omitted_stages:
          type: array
          items:
            type: string
        output_asset_id:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - render_id
      - status
