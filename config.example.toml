# M-Film server configuration. Copy to /etc/mfilm/config.toml (or point
# MFILM_CONFIG / --config at it). Not committed: config.toml is git-ignored.

# archive, catalog, renders (docs/04 server layout)
data_dir = "/var/lib/mfilm"

[photoprism]
# A folder that IS PhotoPrism's originals path as the container sees it
# (check: docker inspect photoprism --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}').
# Only committed, hash-checked renders are copied here (dot-file first, then
# renamed). Leave unset to keep developed rolls out of PhotoPrism.
# Beware network shares: a Samba share may be rooted elsewhere on the server,
# so the same-looking path over CIFS can be a different directory. Simplest is
# to run the worker on the PhotoPrism host itself.
# export_dir = "/mnt/theVault/RAW_LIB/photos"
subdir = "M-Film"

# PhotoPrism does not watch originals: PHOTOPRISM_AUTO_INDEX only covers
# WebDAV uploads. Either set PHOTOPRISM_INDEX_SCHEDULE (cron, e.g. "*/30 * * * *")
# on the PhotoPrism side, or index right after publishing (argv list, no shell):
# index_command = ["ssh", "octopusreborn", "docker", "exec", "photoprism", "photoprism", "index", "M-Film"]

[worker]
# Frames developed at once. A full-size frame needs about 0.9 GB, so size this
# by free memory, not by cores (measured: i7-4770K tops out near 6, ~17 frames/min).
jobs = 1

# Pulling rolls straight from the camera (mfilmctl camera-sync), see deploy/chdkptp.
# [camera]
# host = "192.168.1.50"     # camera IP on Wi-Fi (PTP/IP, after pairing); leave unset for USB
# chdkptp = "docker run --rm --network host --privileged -v /dev/bus/usb:/dev/bus/usb -v {mirror}:{mirror} mfilm-chdkptp"
